# 公開経路。**Cilium Gateway (danything/gitops の bootstrap/gateway/) に付ける HTTPRoute。**
# 証明書は Gateway 側のリスナーに cert-manager がワイルドカードで発行したものが付いているので、
# ここでは指定しない。
# 以前は danything/gitops の apps/gateway-routes/ にあったが、アプリと同じ場所へ移した。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yuzuriha
  namespace: yuzuriha
  annotations:
    # Cloudflare のプロキシを通す(SaaS として外へ出すアプリなので)。DNS のレコード
    # (→ doany.io の proxied の CNAME)は gitops の ExternalDNS がこの注釈を見て作る。
    # 外すとレコードも消え、ワイルドカード(直接つなぐ)で引けるようになる
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["y.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yuzuriha
          port: 80
